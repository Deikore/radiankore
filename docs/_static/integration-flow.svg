<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">Etapas de una emisión RADIAN</title>
<desc id="desc">La aplicación valida actores y antecedentes. El SDK prepara y firma XML, devuelve XML y ZIP y transmite explícitamente con SOAP firmado. La aplicación interpreta y concilia el resultado.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#456"/></marker></defs>
<rect width="720" height="390" rx="14" fill="#f3f6fa"/>
<g font-family="sans-serif" font-size="17" fill="#16324a" text-anchor="middle">
<rect x="30" y="24" width="660" height="60" rx="8" fill="#dbeafe"/><text x="360" y="49">Aplicación: acto, actor, facultades y antecedentes</text><text x="360" y="72" font-size="14">Numeración y selección del ambiente</text>
<rect x="30" y="115" width="660" height="60" rx="8" fill="#dcfce7"/><text x="360" y="140">SDK: modelo → UBL + CUDE → firma XAdES → ZIP</text><text x="360" y="163" font-size="14">prepare_radian_event: sin transmisión</text>
<rect x="30" y="206" width="660" height="60" rx="8" fill="#dcfce7"/><text x="360" y="231">SDK: ZIP original → Base64 → SOAP firmado → HTTPS</text><text x="360" y="254" font-size="14">send_radian_event: envío explícito</text>
<rect x="30" y="297" width="660" height="68" rx="8" fill="#dbeafe"/><text x="360" y="323">Aplicación: interpretar, persistir y conciliar</text><text x="360" y="347" font-size="14">HTTP exitoso no implica aceptación de negocio</text>
</g><g stroke="#456" stroke-width="2" marker-end="url(#arrow)"><path d="M360 86v25"/><path d="M360 177v25"/><path d="M360 268v25"/></g></svg>