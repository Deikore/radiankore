[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "radiankore"
version = "0.1.0"
description = "Python library for RADIAN events and invoice queries through DIAN."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Deikore SAS" }]
keywords = ["dian", "radian", "colombia", "soap", "electronic-invoicing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["cryptography>=46", "httpx>=0.28", "lxml>=5", "xmlsec>=1.3.17"]

[project.urls]
Homepage = "https://github.com/Deikore/radiankore"
Documentation = "https://radiankore.readthedocs.io/"
Repository = "https://github.com/Deikore/radiankore"
Issues = "https://github.com/Deikore/radiankore/issues"
Changelog = "https://github.com/Deikore/radiankore/blob/HEAD/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "lxml-stubs>=0.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/radiankore"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES", "/pyproject.toml"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["radiankore"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
