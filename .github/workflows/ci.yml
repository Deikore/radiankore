name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    env:
      UV_NO_BINARY_PACKAGE: "lxml xmlsec"
    steps:
      - uses: actions/checkout@v4
      - name: Install XML signing build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --python 3.13
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_NO_BINARY_PACKAGE: "lxml xmlsec"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - name: Install XML signing build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      - run: uv run --no-sync --python "${{ matrix.python-version }}" pytest --require-references --cov --cov-report=term-missing --cov-report=xml

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
      - run: uv python install 3.13
      - run: uv run --no-project --with-requirements docs/requirements.txt sphinx-build -E -W --keep-going -b html docs docs/_build/html

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    env:
      UV_NO_BINARY_PACKAGE: "lxml xmlsec"
    steps:
      - uses: actions/checkout@v4
      - name: Install XML signing build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
      - run: uv python install 3.13
      - run: uv build --python 3.13
      - run: uvx --python 3.13 twine check dist/*
      - name: Install wheel in an isolated environment
        run: |
          uv venv --python 3.13 /tmp/radiankore-wheel
          UV_PROJECT_ENVIRONMENT=/tmp/radiankore-wheel uv sync --locked --no-install-project --python 3.13
          uv pip install --python /tmp/radiankore-wheel/bin/python --no-deps dist/*.whl
      - name: Test installed wheel
        working-directory: /tmp
        run: /tmp/radiankore-wheel/bin/python -I -m pytest --allow-missing-references "$GITHUB_WORKSPACE/tests"
      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: radiankore-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
